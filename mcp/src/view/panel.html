<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facet Studio</title>
    <!--
      Two markers below get filled in by buildPanelHtml() in panel.ts: the brand
      token stylesheet and the view script. Nothing in this file may reference an
      outside origin — the panel has to render with no network at all.
    -->
    <!--facet:tokens-->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      /*
        The panel paints its own background instead of inheriting the host's, so
        it stays legible whether the surrounding chrome is light or dark.
      */
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        padding: 16px;
        -webkit-font-smoothing: antialiased;
      }

      .panel {
        display: block;
        margin: 0 auto;
        max-width: 760px;
      }

      .waiting {
        color: var(--ink-faint);
        margin: 0;
      }

      /* Cards are solid and clearly bounded, as they are on the registry. */
      .card {
        background: var(--bg-elev);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-xl);
        padding: 18px 20px;
      }

      .card-head {
        border-bottom: 1px solid var(--line);
        margin: 0 0 12px;
        padding-bottom: 12px;
      }

      /* The registry's eyebrow: mono, wide-tracked, with a diamond lead-in. */
      .operation {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.2em;
        margin: 0 0 4px;
        text-transform: uppercase;
      }

      .operation::before {
        color: var(--accent-b);
        content: "\25C6\00a0";
      }

      /* Facet names are mono everywhere in the registry, not sans. */
      .facet {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }

      .status {
        align-items: center;
        display: flex;
        gap: 8px;
        margin: 0;
      }

      .dot {
        border-radius: 2px;
        display: inline-block;
        flex: none;
        height: 6px;
        width: 6px;
      }

      .status-text {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
      }

      .message {
        color: var(--ink-dim);
        margin: 10px 0 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .assets {
        border-collapse: collapse;
        margin-top: 14px;
        width: 100%;
      }

      .assets caption {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.2em;
        padding-bottom: 8px;
        text-align: left;
        text-transform: uppercase;
      }

      .assets caption::before {
        color: var(--accent-b);
        content: "\25C6\00a0";
      }

      .assets th {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        text-align: left;
      }

      .assets th,
      .assets td {
        border-bottom: 1px solid var(--line);
        padding: 7px 10px 7px 0;
        vertical-align: top;
      }

      .assets tr:last-child td {
        border-bottom: 0;
      }

      /*
        Asset type chips use the registry's tinted-pill recipe. The per-type fill,
        border and text color are generated in panel.ts from the accent tokens.
      */
      .chip {
        align-items: center;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        color: var(--ink-dim);
        display: inline-flex;
        font-family: var(--mono);
        font-size: 11.5px;
        gap: 6px;
        padding: 3px 9px;
        white-space: nowrap;
      }

      .asset-name {
        font-family: var(--mono);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .asset-detail {
        color: var(--ink-dim);
        overflow-wrap: anywhere;
      }

      .empty {
        color: var(--ink-faint);
        margin: 12px 0 0;
      }

      /* ---- Browse gallery ---- */

      .gallery-head {
        align-items: baseline;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .gallery-head .operation {
        margin: 0;
      }

      .gallery-count {
        min-width: 0;
        overflow-wrap: anywhere;
        text-align: right;
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
        margin: 0;
      }

      .gallery {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .facet-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition:
          border-color var(--dur-base) ease,
          transform var(--dur-base) ease;
      }

      .facet-card:hover {
        border-color: color-mix(in oklab, var(--act) 45%, var(--line-strong));
        transform: translateY(-2px);
      }

      .facet-top {
        align-items: baseline;
        display: flex;
        gap: 10px;
      }

      .facet-name {
        color: var(--ink);
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }

      .facet-version {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 11px;
      }

      .facet-by {
        color: var(--ink-dim);
        font-family: var(--mono);
        font-size: 12px;
        margin: 0;
      }

      .facet-desc {
        color: var(--ink-dim);
        margin: 0;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }

      .facet-foot {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-top: 4px;
      }

      .facet-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .facet-date {
        color: var(--ink-faint);
        flex: none;
        font-family: var(--mono);
        font-size: 12px;
      }

      .facet-meta {
        align-items: baseline;
        display: flex;
        flex: none;
        gap: 14px;
      }


      /* ---- Interactive gallery ---- */

      button {
        font-family: inherit;
      }

      :focus-visible {
        border-radius: var(--r-xs);
        outline: 2px solid var(--accent-c);
        outline-offset: 2px;
      }

      .searchbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      .search-input {
        flex: 1;
        min-width: 0;
      }

      .search-go {
        flex: none;
      }

      .fallback-note {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
        margin-bottom: 12px;
      }

      .pager {
        align-items: center;
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
      }

      .pager-label {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
      }

      .pager-btn[disabled] {
        cursor: default;
        opacity: 0.4;
        pointer-events: none;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 14px;
      }

      .filter {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--r-pill);
        color: var(--ink-faint);
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 12px;
        transition:
          color var(--dur-fast) ease,
          border-color var(--dur-fast) ease;
      }

      .filter:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }

      .filter-on {
        background: var(--card);
        border-color: var(--line-strong);
        color: var(--ink);
      }

      /* Outline-first, the way the registry's own CTAs are. */
      .cta {
        align-items: center;
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-md);
        color: var(--ink-dim);
        cursor: pointer;
        display: inline-flex;
        flex: none;
        font-size: var(--fs-small);
        font-weight: 600;
        gap: 7px;
        justify-content: center;
        min-height: 36px;
        padding: 0 16px;
        transition:
          color var(--dur-fast) ease,
          border-color var(--dur-fast) ease;
      }

      .cta:hover {
        border-color: var(--act);
        color: var(--ink);
      }

      .cta-lead {
        border-color: color-mix(in oklab, var(--act) 55%, var(--line-strong));
        color: var(--act);
      }

      .cta-lead:hover {
        border-color: var(--act);
        color: var(--act);
      }

      .cta-busy {
        color: var(--ink-faint);
        cursor: default;
      }

      .cta-done {
        border-color: color-mix(in oklab, var(--ok) 45%, var(--line-strong));
        color: var(--ok);
        cursor: default;
      }

      .cta-failed {
        border-color: color-mix(in oklab, var(--err) 45%, var(--line-strong));
        color: var(--err);
      }

      .facet-top {
        align-items: flex-start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
      }

      .facet-heading {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        min-width: 0;
      }

      /* The name is a button, but it should read as a name. */
      .facet-name {
        background: none;
        border: 0;
        color: var(--ink);
        cursor: pointer;
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        padding: 0;
        text-align: left;
        transition: color var(--dur-fast) ease;
      }

      .facet-name:hover {
        color: var(--accent-skill);
      }

      .facet-toggle {
        background: none;
        border: 0;
        color: var(--ink-faint);
        cursor: pointer;
        flex: none;
        font-family: var(--mono);
        font-size: 12px;
        padding: 0;
        transition: color var(--dur-fast) ease;
      }

      .facet-toggle:hover {
        color: var(--ink);
      }

      .facet-error {
        color: var(--err);
        font-size: 12px;
        margin: 0;
      }

      .facet-card-open {
        border-color: color-mix(in oklab, var(--act) 45%, var(--line-strong));
      }

      .facet-inside {
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-top: 4px;
        padding-top: 13px;
      }

      /* A grid, so the detail column lines up however wide the type chip is. */
      .inside-row {
        align-items: baseline;
        display: grid;
        gap: 11px;
        grid-template-columns: 92px 160px minmax(0, 1fr);
      }

      .inside-row .chip {
        justify-self: start;
      }

      .inside-name {
        color: var(--ink);
        font-family: var(--mono);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .inside-detail {
        color: var(--ink-dim);
        font-size: var(--fs-small);
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }

      .facet-loading {
        color: var(--ink-faint);
        font-size: var(--fs-small);
        margin: 0;
      }

      .empty-state {
        align-items: center;
        border: 1px dashed var(--line-strong);
        border-radius: var(--r-xl);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 40px 20px;
      }

      .empty-state .empty {
        margin: 0;
        text-align: center;
      }

      /* ---- The console shell ---- */

      .console {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* Where you are, and the two other places you could be. */
      .nav {
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 4px;
        padding-bottom: 2px;
      }

      .nav-item {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--ink-faint);
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        margin-bottom: -3px;
        padding: 8px 12px;
        text-transform: uppercase;
        transition: color var(--dur-fast) var(--ease-out);
      }

      .nav-item:hover {
        color: var(--ink-dim);
      }

      .nav-on {
        border-bottom-color: var(--accent-a);
        color: var(--ink);
      }

      /*
        The strip: how the last operation went, kept above whatever screen shows
        the state it produced. Its border takes the status colour, generated in
        panel.ts alongside the dots.
      */
      .strip {
        align-items: baseline;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 12px;
      }

      .strip .dot {
        align-self: center;
      }

      .strip-op {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 11.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .strip-facet {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
      }

      .strip-message {
        color: var(--ink-dim);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .detail-card .facet-by {
        margin-top: 10px;
      }

      .detail-card .facet-desc {
        margin: 8px 0 0;
      }

      .detail-card .facet-chips {
        margin-top: 12px;
      }

      /* ---- Facet detail ---- */

      .detail-head {
        margin-bottom: 4px;
      }

      .back {
        background: none;
        border: 0;
        color: var(--ink-faint);
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        padding: 4px 0;
      }

      .back:hover {
        color: var(--ink);
      }

      .facet-name-static {
        font-family: var(--mono);
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }

      .badge-private {
        border: 1px solid var(--line-strong);
        border-radius: var(--r-pill);
        color: var(--accent-mcp);
        font-family: var(--mono);
        font-size: 11px;
        padding: 2px 8px;
      }

      .tabs {
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 4px;
        margin-top: 14px;
      }

      .tab {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--ink-faint);
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        margin-bottom: -1px;
        padding: 8px 10px;
      }

      .tab:hover {
        color: var(--ink-dim);
      }

      .tab-on {
        border-bottom-color: var(--accent-c);
        color: var(--ink);
      }

      .tab-body {
        padding-top: 12px;
      }

      .version-row {
        align-items: baseline;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        padding: 7px 0;
      }

      .version-name {
        background: none;
        border: 0;
        color: var(--ink);
        cursor: pointer;
        font-family: var(--mono);
        font-size: 13px;
        padding: 0;
      }

      .version-name:hover {
        color: var(--accent-c);
      }

      .version-note {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 11.5px;
      }

      .readme-file {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 11.5px;
        margin: 0 0 8px;
      }

      /*
        Published text, shown as text. No Markdown is rendered here on purpose —
        a pre block cannot become markup however the file was written.
      */
      .readme {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        color: var(--ink-dim);
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.6;
        margin: 0;
        max-height: 420px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ---- Installed ---- */

      .installed-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* One line per facet: what it is on the left, what to do on the right. */
      .facet-row {
        align-items: center;
        background: var(--bg-elev);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-xl);
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        justify-content: space-between;
        padding: 14px 18px;
        transition: border-color var(--dur-base) var(--ease-out);
      }

      .row-main {
        display: flex;
        flex: 1 1 260px;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
      }

      .row-main .facet-chips {
        margin: 0;
      }

      .facet-row:hover {
        border-color: color-mix(in oklab, var(--act) 45%, var(--line-strong));
      }

      /* A removed row stays put so Undo has something to sit on. */
      .facet-row-gone {
        opacity: 0.6;
      }

      .row-name {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      /*
        The scope prefix takes the MCP accent, not the amber the mockups used:
        the two are the same yellow in dark, but in light the amber is 2.9:1 on
        the card and this one is 8.7:1. Same look where it passes, a readable
        colour where it does not.
      */
      .row-scope {
        color: var(--accent-mcp);
      }

      .row-origin {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 11.5px;
      }

      .row-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .row-note {
        color: var(--ink-dim);
        font-size: 13px;
      }

      .installed-foot {
        align-items: baseline;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        margin-top: 6px;
        padding-top: 12px;
      }

      .foot-note {
        color: var(--ink-faint);
        font-size: 12px;
        margin: 0;
      }

      /* The two files disagree, and something can be done about it. */
      .drift {
        background: color-mix(in oklab, var(--accent-d) 8%, var(--bg-elev));
        border: 1px solid color-mix(in oklab, var(--accent-d) 34%, var(--line-strong));
        border-radius: var(--r-lg);
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 14px 16px;
      }

      .drift-title {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        margin: 0;
      }

      .drift-detail {
        color: var(--ink-dim);
        font-size: 13px;
        margin: 0;
        overflow-wrap: anywhere;
      }

      .drift .cta {
        align-self: flex-start;
      }

      .filter-busy {
        color: var(--ink-faint);
      }

      /* ---- Authoring ---- */

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 12px;
      }

      .field-label {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 11.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .field-input {
        background: var(--card);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-md);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 13px;
        min-height: 34px;
        padding: 7px 10px;
        width: 100%;
      }

      textarea.field-input {
        line-height: 1.55;
        min-height: 76px;
        resize: vertical;
      }

      .field-input:focus {
        border-color: color-mix(in oklab, var(--accent-c) 60%, var(--line-strong));
      }

      .bumps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .asset-row {
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 0;
      }

      .asset-head {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
      }

      .asset-label {
        align-items: center;
        display: flex;
        gap: 12px;
      }

      .asset-row .inside-detail {
        margin: 0;
      }

      .asset-new {
        align-items: flex-end;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 6px;
        padding-top: 14px;
      }

      .asset-new .field {
        flex: 1 1 200px;
        margin-top: 0;
      }

      .author-message {
        color: var(--ink-dim);
        margin: 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      /* The console runs wider than a single card, but no wider than the panel. */
      .screen {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      @media (prefers-reduced-motion: reduce) {
        .facet-card:hover,
        .facet-row:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="facet-panel" class="panel" aria-live="polite">
      <p class="waiting">Opening the Facet Studio console…</p>
    </main>
    <!--facet:view-script-->
  </body>
</html>
