<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facet Studio</title>
    <!--
      Two markers below get filled in by buildPanelHtml() in panel.ts: the brand
      token stylesheet and the view script. Nothing in this file may reference an
      outside origin — the panel has to render with no network at all.
    -->
    <!--facet:tokens-->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      /*
        The panel paints its own background instead of inheriting the host's, so
        it stays legible whether the surrounding chrome is light or dark.
      */
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        padding: 16px;
        -webkit-font-smoothing: antialiased;
      }

      .panel {
        display: block;
        margin: 0 auto;
        max-width: 760px;
      }

      .waiting {
        color: var(--ink-faint);
        margin: 0;
      }

      /* Cards are solid and clearly bounded, as they are on the registry. */
      .card {
        background: var(--bg-elev);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-xl);
        padding: 18px 20px;
      }

      .card-head {
        border-bottom: 1px solid var(--line);
        margin: 0 0 12px;
        padding-bottom: 12px;
      }

      /* The registry's eyebrow: mono, wide-tracked, with a diamond lead-in. */
      .operation {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.2em;
        margin: 0 0 4px;
        text-transform: uppercase;
      }

      .operation::before {
        color: var(--accent-b);
        content: "\25C6\00a0";
      }

      /* Facet names are mono everywhere in the registry, not sans. */
      .facet {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }

      .status {
        align-items: center;
        display: flex;
        gap: 8px;
        margin: 0;
      }

      .dot {
        border-radius: 2px;
        display: inline-block;
        flex: none;
        height: 6px;
        width: 6px;
      }

      .status-text {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
      }

      .message {
        color: var(--ink-dim);
        margin: 10px 0 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .assets {
        border-collapse: collapse;
        margin-top: 14px;
        width: 100%;
      }

      .assets caption {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.2em;
        padding-bottom: 8px;
        text-align: left;
        text-transform: uppercase;
      }

      .assets caption::before {
        color: var(--accent-b);
        content: "\25C6\00a0";
      }

      .assets th {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        text-align: left;
      }

      .assets th,
      .assets td {
        border-bottom: 1px solid var(--line);
        padding: 7px 10px 7px 0;
        vertical-align: top;
      }

      .assets tr:last-child td {
        border-bottom: 0;
      }

      /*
        Asset type chips use the registry's tinted-pill recipe. The per-type fill,
        border and text color are generated in panel.ts from the accent tokens.
      */
      .chip {
        align-items: center;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        color: var(--ink-dim);
        display: inline-flex;
        font-family: var(--mono);
        font-size: 11.5px;
        gap: 6px;
        padding: 3px 9px;
        white-space: nowrap;
      }

      .asset-name {
        font-family: var(--mono);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .asset-detail {
        color: var(--ink-dim);
        overflow-wrap: anywhere;
      }

      .empty {
        color: var(--ink-faint);
        margin: 12px 0 0;
      }

      /* ---- Browse gallery ---- */

      .gallery-head {
        align-items: baseline;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .gallery-head .operation {
        margin: 0;
      }

      .gallery-count {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 12px;
        margin: 0;
      }

      .gallery {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .facet-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition:
          border-color var(--dur-base) ease,
          transform var(--dur-base) ease;
      }

      .facet-card:hover {
        border-color: color-mix(in oklab, var(--act) 45%, var(--line-strong));
        transform: translateY(-2px);
      }

      .facet-top {
        align-items: baseline;
        display: flex;
        gap: 10px;
      }

      .facet-name {
        color: var(--ink);
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }

      .facet-version {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 11px;
      }

      .facet-by {
        color: var(--ink-dim);
        font-family: var(--mono);
        font-size: 12px;
        margin: 0;
      }

      .facet-desc {
        color: var(--ink-dim);
        margin: 0;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }

      .facet-foot {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-top: 4px;
      }

      .facet-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .facet-date {
        color: var(--ink-faint);
        flex: none;
        font-family: var(--mono);
        font-size: 12px;
      }

      .facet-meta {
        align-items: baseline;
        display: flex;
        flex: none;
        gap: 14px;
      }


      /* ---- Interactive gallery ---- */

      button {
        font-family: inherit;
      }

      :focus-visible {
        border-radius: var(--r-xs);
        outline: 2px solid var(--accent-c);
        outline-offset: 2px;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 14px;
      }

      .filter {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--r-pill);
        color: var(--ink-faint);
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 12px;
        transition:
          color var(--dur-fast) ease,
          border-color var(--dur-fast) ease;
      }

      .filter:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }

      .filter-on {
        background: var(--card);
        border-color: var(--line-strong);
        color: var(--ink);
      }

      /* Outline-first, the way the registry's own CTAs are. */
      .cta {
        align-items: center;
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-md);
        color: var(--ink-dim);
        cursor: pointer;
        display: inline-flex;
        flex: none;
        font-size: var(--fs-small);
        font-weight: 600;
        gap: 7px;
        justify-content: center;
        min-height: 36px;
        padding: 0 16px;
        transition:
          color var(--dur-fast) ease,
          border-color var(--dur-fast) ease;
      }

      .cta:hover {
        border-color: var(--act);
        color: var(--ink);
      }

      .cta-lead {
        border-color: color-mix(in oklab, var(--act) 55%, var(--line-strong));
        color: var(--act);
      }

      .cta-lead:hover {
        border-color: var(--act);
        color: var(--act);
      }

      .cta-busy {
        color: var(--ink-faint);
        cursor: default;
      }

      .cta-done {
        border-color: color-mix(in oklab, var(--ok) 45%, var(--line-strong));
        color: var(--ok);
        cursor: default;
      }

      .cta-failed {
        border-color: color-mix(in oklab, var(--err) 45%, var(--line-strong));
        color: var(--err);
      }

      .facet-top {
        align-items: flex-start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
      }

      .facet-heading {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        min-width: 0;
      }

      /* The name is a button, but it should read as a name. */
      .facet-name {
        background: none;
        border: 0;
        color: var(--ink);
        cursor: pointer;
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        padding: 0;
        text-align: left;
        transition: color var(--dur-fast) ease;
      }

      .facet-name:hover {
        color: var(--accent-skill);
      }

      .facet-toggle {
        background: none;
        border: 0;
        color: var(--ink-faint);
        cursor: pointer;
        flex: none;
        font-family: var(--mono);
        font-size: 12px;
        padding: 0;
        transition: color var(--dur-fast) ease;
      }

      .facet-toggle:hover {
        color: var(--ink);
      }

      .facet-error {
        color: var(--err);
        font-size: 12px;
        margin: 0;
      }

      .facet-card-open {
        border-color: color-mix(in oklab, var(--act) 45%, var(--line-strong));
      }

      .facet-inside {
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-top: 4px;
        padding-top: 13px;
      }

      /* A grid, so the detail column lines up however wide the type chip is. */
      .inside-row {
        align-items: baseline;
        display: grid;
        gap: 11px;
        grid-template-columns: 92px 160px minmax(0, 1fr);
      }

      .inside-row .chip {
        justify-self: start;
      }

      .inside-name {
        color: var(--ink);
        font-family: var(--mono);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .inside-detail {
        color: var(--ink-dim);
        font-size: var(--fs-small);
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }

      .facet-loading {
        color: var(--ink-faint);
        font-size: var(--fs-small);
        margin: 0;
      }

      .empty-state {
        align-items: center;
        border: 1px dashed var(--line-strong);
        border-radius: var(--r-xl);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 40px 20px;
      }

      .empty-state .empty {
        margin: 0;
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .facet-card:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="facet-panel" class="panel" aria-live="polite">
      <p class="waiting">Waiting for a Facet Studio result…</p>
    </main>
    <!--facet:view-script-->
  </body>
</html>
